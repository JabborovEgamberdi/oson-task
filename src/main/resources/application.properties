spring.application.name=oson-tech-task
server.port=8080
# src/main/resources/application.properties
logging.level.org.springframework.boot.context.logging=DEBUG

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#management.metrics.export.otlp.enabled=true
#management.tracing.otlp.endpoint=http://otel-collector:4317
#management.metrics.otlp.endpoint=http://otel-collector:4317
management.tracing.enabled=true

management.endpoints.web.exposure.include=health,metrics,prometheus
management.otlp.metrics.export.url=http://otel-collector:4318/v1/metrics
management.otlp.metrics.export.step=10
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces
