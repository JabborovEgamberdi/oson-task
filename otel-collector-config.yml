receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: { }

extensions:
  health_check: { }

exporters:

  otlp:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:9091"

  debug:

#  jaeger:
#    endpoint: jaeger-all-in-one:14250
#    tls:
#      insecure: true

  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"


service:
  pipelines:

    traces:
      receivers: [ otlp ]
      exporters: [ otlp ]

    metrics:
      receivers: [ otlp ]
      exporters: [ prometheus ]

    logs:
      receivers: [ otlp ]
      exporters: [ loki ]